name: Release public transfer audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-content:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify complete public HTTPS installer with ordered ranges
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures,hashlib,json,pathlib,ssl,tempfile,time,urllib.request
          url='https://deltaxiaoxi.xin/updates/packages/0.9304/DeltaNFD_Setup_0.9304_x64.exe'
          size=297558459
          expected='78c91e871430fbf8a9f0dbb04a958d23be29563960fe4c78a47cac894e487ec2'
          root=pathlib.Path(tempfile.mkdtemp(prefix='deltanfd-public-transfer-'))
          step=4*1024*1024;count=(size+step-1)//step;started=time.monotonic()
          def part(i):
              start=i*step;end=min(size-1,start+step-1)
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'Range':f'bytes={start}-{end}','Accept-Encoding':'identity','User-Agent':'DeltaNFD-public-transfer-audit'})
                      with urllib.request.urlopen(req,timeout=60,context=ssl.create_default_context()) as response:
                          assert response.status==206 and response.headers.get('Content-Range')==f'bytes {start}-{end}/{size}'
                          data=response.read(end-start+2)
                          assert len(data)==end-start+1
                      (root/str(i)).write_bytes(data)
                      return i
                  except Exception as ex:
                      if attempt==2:raise
                      print('retry',i,attempt+1,str(ex)[:100],flush=True)
                      time.sleep(2)
          done=0
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              for future in concurrent.futures.as_completed([pool.submit(part,i) for i in range(count)]):
                  future.result();done+=1
                  if done%8==0 or done==count:print('verified ranges',done,'/',count,flush=True)
                  if time.monotonic()-started>1000:raise TimeoutError('Bounded external transfer audit exceeded time budget')
          digest=hashlib.sha256();received=0
          for i in range(count):
              data=(root/str(i)).read_bytes();digest.update(data);received+=len(data)
          assert received==size and digest.hexdigest()==expected
          result=dict(url=url,bytes=received,sha256=digest.hexdigest(),tlsVerified=True,fullPublicContentVerified=True,independentRunner=True,ranges=count,elapsedSeconds=round(time.monotonic()-started,2))
          pathlib.Path('transfer-result.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
          print(json.dumps(result),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: selfhost-public-transfer
          path: transfer-result.json
          retention-days: 7
