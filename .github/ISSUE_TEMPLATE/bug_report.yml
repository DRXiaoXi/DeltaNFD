name: 问题反馈
description: 报告可复现的问题，提交前移除个人信息。
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: 软件版本与系统
      description: 填写完整显示版本、Windows 版本和相关硬件。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 从什么状态开始，操作了什么，出现了什么结果？
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏证据
      description: 可附错误摘要或截图；不要公开上传原始玩家日志、完整路径、令牌或账户信息。
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交检查
      options:
        - label: 我已移除个人信息；涉及漏洞细节时改用私密反馈。
          required: true
