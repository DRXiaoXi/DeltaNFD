# http {} level: install in /etc/nginx/conf.d/deltanfd-feedback-limits.conf
limit_req_zone $binary_remote_addr zone=deltanfd_feedback:1m rate=2r/m;

# Constant key: global limits cannot be evaded by changing Host or source IP.
map $host $deltanfd_feedback_global_key {
    default "feedback-all";
}
limit_req_zone $deltanfd_feedback_global_key zone=deltanfd_feedback_total:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=deltanfd_feedback_health_ip:1m rate=6r/m;
limit_req_zone $deltanfd_feedback_global_key zone=deltanfd_feedback_health_total:1m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=deltanfd_feedback_conn_ip:1m;
limit_conn_zone $deltanfd_feedback_global_key zone=deltanfd_feedback_conn_total:1m;
